<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python学习笔记和实验报告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0ea5e9, #14b8a6);
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
            padding: 60px 20px;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 12px;
            font-size: 32px;
            font-weight: 600;
            color: #f0f9ff;
        }
        .subtitle {
            color: #e0f2fe;
            margin-bottom: 40px;
            font-size: 16px;
            opacity: 0.9;
        }
        .btn {
            display: block;
            margin: 16px auto;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            text-align: left;
        }
        .btn:hover {
            background: #ffffff;
            color: #0f766e;
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
        }
        .btn-icon {
            margin-right: 10px;
        }
        .back {
            margin-top: 48px;
            display: inline-block;
            color: #e0f2fe;
            text-decoration: none;
            font-size: 16px;
            transition: 0.2s;
        }
        .back:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        footer {
            margin-top: 60px;
            opacity: 0.7;
            font-size: 14px;
            color: #e0f2fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 学习笔记目录</h1>
        <div class="subtitle">Python / Java 笔记 & 实验报告汇总</div>

        <a href="Javanote1.html" class="btn">
            <span class="btn-icon">☕</span>第一篇 · Java 基本数据类型
        </a>

        <a href="#" class="back">← 返回主页</a>

        <footer>
            持续更新中
        </footer>
    </div>
</body>
</html>
